<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your account." />
  <title>Create an account</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f5fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: radial-gradient(circle at 15% 15%, #e5eaff 0, transparent 35%), #f3f5fb;
    }

    .card {
      width: min(100%, 440px);
      padding: 40px;
      border: 1px solid #e6e9f2;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 55px rgb(34 47 87 / 10%);
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 13px;
      background: #4f46e5;
      color: #fff;
      font-size: 22px;
      font-weight: 750;
    }

    h1 { margin: 0; font-size: 1.8rem; letter-spacing: -0.04em; }
    .intro { margin: 9px 0 28px; color: #667085; line-height: 1.5; }
    .field { margin-bottom: 18px; }
    label { display: block; margin-bottom: 7px; font-size: 0.9rem; font-weight: 650; }

    input {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #d5d9e4;
      border-radius: 9px;
      background: #fff;
      color: inherit;
      font: inherit;
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
    }

    input::placeholder { color: #98a0b2; }
    input:focus { border-color: #5b55e7; box-shadow: 0 0 0 3px rgb(91 85 231 / 15%); }
    input[aria-invalid="true"] { border-color: #d92d20; }
    .hint { margin: 6px 0 0; color: #667085; font-size: 0.8rem; }
    .error { min-height: 1.15em; margin: 5px 0 0; color: #b42318; font-size: 0.8rem; }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 68px; }
    .toggle-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      padding: 6px;
      border: 0;
      background: transparent;
      color: #4f46e5;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 650;
      cursor: pointer;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 3px 0 22px;
      color: #475467;
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .terms input { width: 16px; min-height: 16px; margin: 2px 0 0; accent-color: #4f46e5; }
    a { color: #4f46e5; font-weight: 600; }

    .submit-button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      background: #4f46e5;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms, transform 150ms;
    }

    .submit-button:hover { background: #4338ca; }
    .submit-button:active { transform: translateY(1px); }
    .submit-button:focus-visible, .toggle-password:focus-visible, a:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 3px; }
    .sign-in { margin: 22px 0 0; text-align: center; color: #667085; font-size: 0.9rem; }
    .success { margin: 16px 0 0; color: #067647; font-size: 0.9rem; text-align: center; }

    @media (max-width: 480px) {
      .card { padding: 30px 22px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand-mark" aria-hidden="true">D</div>
    <h1>Create your account</h1>
    <p class="intro">Get started by filling in the details below.</p>

    <form id="registration-form" novalidate>
      <div class="field">
        <label for="full-name">Full name</label>
        <input id="full-name" name="fullName" type="text" autocomplete="name" placeholder="Jane Doe" required />
        <p class="error" id="full-name-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        <p class="error" id="email-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required />
          <button class="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
        </div>
        <p class="hint">Use at least 8 characters.</p>
        <p class="error" id="password-error" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password" required />
        <p class="error" id="confirm-password-error" aria-live="polite"></p>
      </div>

      <label class="terms" for="terms">
        <input id="terms" name="terms" type="checkbox" required />
        <span>I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</span>
      </label>
      <p class="error" id="terms-error" aria-live="polite"></p>

      <button class="submit-button" type="submit">Create account</button>
      <p class="success" id="form-message" role="status" aria-live="polite"></p>
    </form>

    <p class="sign-in">Already have an account? <a href="#sign-in">Sign in</a></p>
  </main>

  <script>
    const form = document.querySelector("#registration-form");
    const passwordInput = document.querySelector("#password");
    const togglePassword = document.querySelector(".toggle-password");
    const formMessage = document.querySelector("#form-message");

    togglePassword.addEventListener("click", () => {
      const showing = passwordInput.type === "text";
      passwordInput.type = showing ? "password" : "text";
      togglePassword.textContent = showing ? "Show" : "Hide";
      togglePassword.setAttribute("aria-pressed", String(!showing));
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      formMessage.textContent = "";

      const fields = [
        { input: document.querySelector("#full-name"), error: document.querySelector("#full-name-error"), message: "Please enter your name." },
        { input: document.querySelector("#email"), error: document.querySelector("#email-error"), message: "Enter a valid email address." },
        { input: passwordInput, error: document.querySelector("#password-error"), message: "Password must be at least 8 characters." },
        { input: document.querySelector("#confirm-password"), error: document.querySelector("#confirm-password-error"), message: "Passwords do not match." }
      ];

      let firstInvalid = null;
      for (const field of fields) {
        let valid = field.input.checkValidity();
        if (field.input.id === "confirm-password") {
          valid = valid && field.input.value === passwordInput.value;
        }
        field.input.setAttribute("aria-invalid", String(!valid));
        field.error.textContent = valid ? "" : field.message;
        if (!valid && !firstInvalid) firstInvalid = field.input;
      }

      const terms = document.querySelector("#terms");
      const termsError = document.querySelector("#terms-error");
      terms.setAttribute("aria-invalid", String(!terms.checked));
      termsError.textContent = terms.checked ? "" : "Please accept the terms to continue.";

      if (!terms.checked && !firstInvalid) firstInvalid = terms;
      if (firstInvalid) {
        firstInvalid.focus();
        return;
      }

      // Connect this point to your server/API to create the account securely.
      formMessage.textContent = "Form validated. Connect a backend to finish creating your account.";
    });
  </script>
</body>
</html>
